.0 635.0,383.0" class="e e-ink" marker-end="url(#f2-ink)"/><rect x="640" y="360.0" width="520" height="46" rx="4" class="b-plain"/><text x="652.0" y="387.5" text-anchor="start" class="">Stamina: база × (1 + бонус), реген так же</text><text x="1148.0" y="387.0" text-anchor="end" class="t-lab">оба</text><polyline points="600.0,437.0 635.0,437.0" class="e e-npc" marker-end="url(#f2-npc)"/><rect x="640" y="414.0" width="520" height="46" rx="4" class="b-npc"/><text x="652.0" y="441.5" text-anchor="start" class="">OnBodyStats(скорость хода) — психикам</text><text x="1148.0" y="441.0" text-anchor="end" class="t-lab t-npc">NPC</text><polyline points="600.0,491.0 635.0,491.0" class="e e-ink" marker-end="url(#f2-ink)"/><rect x="640" y="468.0" width="520" height="46" rx="4" class="b-plain"/><text x="652.0" y="487.0" text-anchor="start" class="">MorphBuilder.Build — модель из надетых органов,</text><text x="652.0" y="504.0" text-anchor="start" class="">телеграф, камуфляж, вспышка, тепло — заново</text><text x="1148.0" y="495.0" text-anchor="end" class="t-lab">оба</text><polyline points="600.0,545.0 635.0,545.0" class="e e-ink" marker-end="url(#f2-ink)"/><rect x="640" y="522.0" width="520" height="46" rx="4" class="b-plain"/><text x="652.0" y="549.5" text-anchor="start" class="">UpdateTint · цвет запахового следа по составу</text><text x="1148.0" y="549.0" text-anchor="end" class="t-lab">оба</text><polyline points="600.0,599.0 635.0,599.0" class="e e-ink" marker-end="url(#f2-ink)"/><rect x="640" y="576.0" width="520" height="46" rx="4" class="b-plain"/><text x="652.0" y="603.5" text-anchor="start" class="">MostKin → onDominantChanged (слушает Metamorph)</text><text x="1148.0" y="603.0" text-anchor="end" class="t-lab">оба</text></svg>
