<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="390" viewBox="0 0 1180 390" role="img" aria-label="Рис. 5. Смерть, родство, метаморфоза"><title>Рис. 5. Смерть, родство, метаморфоза</title><style>text{fill:#16201C;font-family:"Golos Text","Segoe UI",system-ui,Arial,sans-serif;font-size:13px}.t-h,.t-strong{font-weight:600}.t-sub{fill:#55635D;font-size:12px}.t-lab{fill:#55635D;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:10.5px;letter-spacing:.07em}.t-mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:11.5px}.t-edge{fill:#55635D;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:10.5px}.t-tick{fill:#55635D;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:11px}.t-seg{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:11px}.t-pl{fill:#255F92} .t-npc{fill:#91540F}.b-body{fill:#E0E7E1;stroke:#16201C;stroke-width:1.1}.b-plain{fill:#F7F9F6;stroke:#C4CEC7;stroke-width:1}.b-pl{fill:#DCE7F1;stroke:#255F92;stroke-width:1.2}.b-npc{fill:#F2E5D3;stroke:#91540F;stroke-width:1.2}.b-note{fill:none;stroke:#55635D;stroke-width:1;stroke-dasharray:4 3}.e{fill:none;stroke:#55635D;stroke-width:1.4}.e-pl{stroke:#255F92} .e-npc{stroke:#91540F} .e-ink{stroke:#16201C}.ah{fill:#55635D} .ah-pl{fill:#255F92} .ah-npc{fill:#91540F} .ah-ink{fill:#16201C}.rule-pl{stroke:#255F92;stroke-width:2} .rule-npc{stroke:#91540F;stroke-width:2} .rule-ink{stroke:#16201C;stroke-width:2}.grid-l{stroke:#C4CEC7;stroke-width:1;fill:none}.axis{stroke:#55635D;stroke-width:1.2;fill:none}.series-pl{fill:none;stroke:#255F92;stroke-width:3;stroke-linejoin:round}.series-code{fill:none;stroke:#55635D;stroke-width:1.6;stroke-dasharray:6 5}.series-npc{stroke:#91540F;stroke-width:3}.series-npc2{stroke:#91540F;stroke-width:1.6;stroke-dasharray:3 3}.dot-pl{fill:#255F92;stroke:#F7F9F6;stroke-width:2}.seg0{fill:#D5DDD7} .seg1{fill:#B9C7BE} .seg2{fill:#8FA497} .seg3{fill:#16201C}</style><rect width="1180" height="390" fill="#F7F9F6"/><defs><marker id="f5-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="f5-pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-pl"/></marker><marker id="f5-npc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-npc"/></marker><marker id="f5-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-ink"/></marker></defs><rect x="20" y="40" width="190" height="76" rx="4" class="b-body"/><text x="32.0" y="64.5" text-anchor="start" class="t-h">смерть жертвы</text><text x="32.0" y="82.5" text-anchor="start" class="t-mono">Health.onDeath</text><text x="32.0" y="100.5" text-anchor="start" class="t-mono">→ CreditKiller</text><polyline points="210.0,78.0 246.0,78.0" class="e e-ink" marker-end="url(#f5-ink)"/><text x="228.0" y="70.0" text-anchor="middle" class="t-edge">убийца</text><rect x="250" y="40" width="240" height="76" rx="4" class="b-body"/><text x="262.0" y="64.5" text-anchor="start" class="t-h">убийце — любому телу</text><text x="262.0" y="82.5" text-anchor="start" class="">родство: шасси и органы × 0,55</text><text x="262.0" y="100.5" text-anchor="start" class="">сытость — если ест мясо</text><polyline points="490.0,78.0 526.0,78.0" class="e e-ink" marker-end="url(#f5-ink)"/><rect x="530" y="40" width="210" height="76" rx="4" class="b-body"/><text x="542.0" y="64.5" text-anchor="start" class="t-mono t-h">TryChimerize</text><text x="542.0" y="82.5" text-anchor="start" class="">случайный орган жертвы</text><text x="542.0" y="100.5" text-anchor="start" class="">шанс = родство / 100</text><polyline points="740.0,78.0 776.0,78.0" class="e e-ink" marker-end="url(#f5-ink)"/><text x="758.0" y="70.0" text-anchor="middle" class="t-edge">Install</text><rect x="780" y="40" width="180" height="76" rx="4" class="b-body"/><text x="792.0" y="64.5" text-anchor="start" class="t-mono t-h">Recompute</text><text x="792.0" y="82.5" text-anchor="start" class="">слот, пул, вклады,</text><text x="792.0" y="100.5" text-anchor="start" class="">идентичность заново</text><polyline points="960.0,78.0 986.0,78.0" class="e e-ink" marker-end="url(#f5-ink)"/><polygon points="990,78 1070,34 1150,78 1070,122" class="b-body"/><text x="1070.0" y="74.0" text-anchor="middle" class="t-h">доминанта</text><text x="1070.0" y="91.0" text-anchor="middle" class="t-sub">сменилась?</text><polyline points="1070.0,122.0 1070.0,176.0" class="e e-npc" marker-end="url(#f5-npc)"/><text x="1080.0" y="152.0" text-anchor="start" class="t-edge t-npc">да</text><text x="1070.0" y="20.0" text-anchor="middle" class="t-sub">нет — психика прежняя</text><rect x="950" y="180" width="220" height="76" rx="4" class="b-npc"/><text x="962.0" y="204.5" text-anchor="start" class="t-h">Metamorph — только NPC</text><text x="962.0" y="222.5" text-anchor="start" class="t-mono">Constrict.End()</text><text x="962.0" y="240.5" text-anchor="start" class="">снять психику</text><polyline points="950.0,218.0 864.0,218.0" class="e e-npc" marker-end="url(#f5-npc)"/><rect x="600" y="180" width="260" height="76" rx="4" class="b-npc"/><text x="612.0" y="204.5" text-anchor="start" class="t-mono t-h">PsycheDispatch.Attach</text><text x="612.0" y="222.5" text-anchor="start" class="">психика по MostKin</text><text x="612.0" y="240.5" text-anchor="start" class="t-mono">и Refeed</text><polyline points="600.0,218.0 514.0,218.0" class="e e-npc" marker-end="url(#f5-npc)"/><rect x="250" y="180" width="260" height="76" rx="4" class="b-npc"/><text x="262.0" y="204.5" text-anchor="start" class="t-h">новая психика</text><text x="262.0" y="222.5" text-anchor="start" class="t-mono">Wolf · Snake · Moose · Hedgehog</text><text x="262.0" y="240.5" text-anchor="start" class="t-mono">или ChimeraAlpha</text><polyline points="250.0,218.0 115.0,218.0 115.0,120.0" class="e" stroke-dasharray="5 4" marker-end="url(#f5-m)"/><text x="125.0" y="244.0" text-anchor="start" class="t-edge">следующее убийство</text><text x="20.0" y="324.0" text-anchor="start" class="t-lab">ИДЕНТИЧНОСТЬ К ВИДУ</text><text x="20.0" y="344.0" text-anchor="start" class="t-sub">шасси весит 0,1,</text><text x="20.0" y="362.0" text-anchor="start" class="t-sub">органы вида — 0,9 / N</text><rect x="250.0" y="308" width="598.0" height="22" class="seg0"/><text x="549.0" y="324.0" text-anchor="middle" class="t-seg">None — чужой</text><rect x="848.0" y="308" width="184.0" height="22" class="seg1"/><text x="940.0" y="324.0" text-anchor="middle" class="t-seg">Weak</text><rect x="1032.0" y="308" width="137.1" height="22" class="seg2"/><text x="1100.5" y="324.0" text-anchor="middle" class="t-seg">Medium</text><rect x="1169.1" y="308" width="3.0" height="22" class="seg3"/><line x1="250.0" y1="330" x2="250.0" y2="338" class="axis"/><text x="250.0" y="354.0" text-anchor="start" class="t-tick">0</text><line x1="848.0" y1="330" x2="848.0" y2="338" class="axis"/><text x="848.0" y="354.0" text-anchor="middle" class="t-tick">0,65</text><line x1="1032.0" y1="330" x2="1032.0" y2="338" class="axis"/><text x="1032.0" y="354.0" text-anchor="middle" class="t-tick">0,85</text><line x1="1170.0" y1="330" x2="1170.0" y2="338" class="axis"/><text x="1170.0" y="354.0" text-anchor="end" class="t-tick">1 — Strong</text><text x="1032.0" y="374.0" text-anchor="middle" class="t-sub">метаморфоза — от этого порога</text></svg>
