10" fill="#F7F9F6"/><defs><marker id="f1-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="f1-pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-pl"/></marker><marker id="f1-npc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-npc"/></marker><marker id="f1-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-ink"/></marker></defs><text x="240.0" y="26.0" text-anchor="middle" class="t-lab t-pl t-strong">ИГРОК</text><text x="615.0" y="26.0" text-anchor="middle" class="t-lab t-strong">ТЕЛО · CreatureBody</text><text x="1010.0" y="26.0" text-anchor="middle" class="t-lab t-npc t-strong">NPC</text><line x1="100" y1="38" x2="380" y2="38" class="rule-pl"/><line x1="470" y1="38" x2="760" y2="38" class="rule-ink"/><line x1="850" y1="38" x2="1170" y2="38" class="rule-npc"/><text x="88.0" y="97.0" text-anchor="end" class="t-lab">РОЖДЕНИЕ</text><rect x="100" y="58" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="88.5" text-anchor="start" class="t-h">Сцена SampleScene · объект Player</text><text x="112.0" y="106.5" text-anchor="start" class="">компоненты лежат в сцене</text><rect x="470" y="58" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="88.5" text-anchor="start" class="t-h">Awake: слоты · Start: Recompute</text><text x="482.0" y="106.5" text-anchor="start" class="">Configure(шасси, доноры) — то же</text><rect x="850" y="58" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="88.5" text-anchor="start" class="t-h">Спавнер: Instantiate(префаб вида)</text><text x="862.0" y="106.5" text-anchor="start" class="">босс: ChimeraFactory.Spawn → Configure</text><polyline points="384.0,93.0 465.0,93.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="85.0" text-anchor="middle" class="t-edge">Awake</text><polyline points="846.0,93.0 765.0,93.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="85.0" text-anchor="middle" class="t-edge">Awake</text><text x="88.0" y="181.0" text-anchor="end" class="t-lab">СОСТАВ</text><rect x="100" y="142" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="172.5" text-anchor="start" class="t-h">шасси Человек · пул 16</text><text x="112.0" y="190.5" text-anchor="start" class="">доноры: Волк, Змея, Лось, Ёж</text><rect x="470" y="142" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="172.5" text-anchor="start" class="t-h">слот = орган шасси</text><text x="482.0" y="190.5" text-anchor="start" class="">+ органы доноров с тем же слотом</text><rect x="850" y="142" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="172.5" text-anchor="start" class="t-h">шасси = вид префаба</text><text x="862.0" y="190.5" text-anchor="start" class="">доноры = 4 зверя из EvolutionConfig</text><polyline points="384.0,177.0 465.0,177.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="169.0" text-anchor="middle" class="t-edge">chassis</text><polyline points="846.0,177.0 765.0,177.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="169.0" text-anchor="middle" class="t-edge">chassis</text><text x="88.0" y="265.0" text-anchor="end" class="t-lab">МОЩЬ</text><rect x="100" y="226" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="256.5" text-anchor="start" class="t-h">родство к виду органа: ×1 → ×2</text><text x="112.0" y="274.5" text-anchor="start" class="">в сцене растёт с 80 до 100</text><rect x="470" y="226" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="256.5" text-anchor="start" class="t-h">Express: родной v × m,</text><text x="482.0" y="274.5" text-anchor="start" class="">донорский база + (v − база) × m</text><rect x="850" y="226" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="256.5" text-anchor="start" class="t-h">фиксированная expression</text><text x="862.0" y="274.5" text-anchor="start" class="">волк 0.45 · лось, змея, ёж 0.5</text><polyline points="384.0,261.0 465.0,261.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="253.0" text-anchor="middle" class="t-edge">m</text><polyline points="846.0,261.0 765.0,261.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="253.0" text-anchor="middle" class="t-edge">m</text><text x="88.0" y="349.0" text-anchor="end" class="t-lab">КОМПОНЕНТЫ</text><rect x="100" y="310" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="340.5" text-anchor="start" class="t-h">+ Senses — профиль чувств</text><text x="112.0" y="358.5" text-anchor="start" class="">+ Betrayal — эрозия признания</text><rect x="470" y="310" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="340.5" text-anchor="start" class="t-h">+ Noise, Satiety, ScentTrail,</text><text x="482.0" y="358.5" text-anchor="start" class="">EmotionTint, TintMixer, Stamina</text><rect x="850" y="310" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="340.5" text-anchor="start" class="t-h">+ Personality, SpawnVariance, Morale</text><text x="862.0" y="358.5" text-anchor="start" class="">+ Metamorph (эволюция включена)</text><polyline points="466.0,345.0 385.0,345.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="337.0" text-anchor="middle" class="t-edge">AddComponent</text><polyline points="764.0,345.0 845.0,345.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="337.0" text-anchor="middle" class="t-edge">AddComponent</text><text x="88.0" y="433.0" text-anchor="end" class="t-lab">ПРИЁМЫ</text><rect x="100" y="394" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="424.5" text-anchor="start" class="t-h">грани Player*: PlayerBite,</text><text x="112.0" y="442.5" text-anchor="start" class="">PlayerAttack, PlayerConstrict…</text><rect x="470" y="394" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="424.5" text-anchor="start" class="t-h">запись органа → носитель;</text><text x="482.0" y="442.5" text-anchor="start" class="">носитель платит цену и ждёт откат</text><rect x="850" y="394" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="424.5" text-anchor="start" class="t-h">доставки: BiteAbility, ChargeAbility…</text><text x="862.0" y="442.5" text-anchor="start" class="">машины Constrict, CurlDefense</text><polyline points="466.0,429.0 385.0,429.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="421.0" text-anchor="middle" class="t-edge">Configure</text><polyline points="764.0,429.0 845.0,429.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="421.0" text-anchor="middle" class="t-edge">Configure</text><text x="88.0" y="517.0" text-anchor="end" class="t-lab">СТАТЫ</text><rect x="100" y="478" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="508.5" text-anchor="start" class="t-h">PlayerController: ход, рывок</text><text x="112.0" y="526.5" text-anchor="start" class="">PlayerAttack: темп от Сердца</text><rect x="470" y="478" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="508.5" text-anchor="start" class="t-h">сумма вкладов → Health, Stamina,</text><text x="482.0" y="526.5" text-anchor="start" class="">маркеры Thorns, Massive, Camouflage…</text><rect x="850" y="478" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="508.5" text-anchor="start" class="t-h">психика получает скорость хода</text><text x="862.0" y="526.5" text-anchor="start" class="">числа приёмов — только в записях</text><polyline points="466.0,513.0 385.0,513.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="505.0" text-anchor="middle" class="t-edge">SetLegs</text><polyline points="764.0,513.0 845.0,513.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="505.0" text-anchor="middle" class="t-edge">OnBodyStats</text><text x="88.0" y="601.0" text-anchor="end" class="t-lab">КОМАНДЫ</text><rect x="100" y="562" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="592.5" text-anchor="start" class="t-h">PlayerInputDriver: кнопка → TryUse()</text><text x="112.0" y="610.5" text-anchor="start" class="">1–6 — смена органа в слоте</text><rect x="470" y="562" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="592.5" text-anchor="start" class="t-h">тело не читает ввод</text><text x="482.0" y="610.5" text-anchor="start" class="">и не запускает приёмы</text><rect x="850" y="562" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="592.5" text-anchor="start" class="t-h">психика решает: CanUse → TryUse()</text><text x="862.0" y="610.5" text-anchor="start" class="">альфа: арсенал и простой захват</text><polyline points="384.0,597.0 465.0,597.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="589.0" text-anchor="middle" class="t-edge">ToggleSlot</text><polyline points="846.0,597.0 765.0,597.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="589.0" text-anchor="middle" class="t-edge">Ability&lt;T&gt;</text><text x="88.0" y="685.0" text-anchor="end" class="t-lab">ЧУВСТВА</text><rect x="100" y="646" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="676.5" text-anchor="start" class="t-h">Perception: нюх, термо, Чутьё, слух</text><text x="112.0" y="694.5" text-anchor="start" class="">Senses.Set — дальности от сборки</text><rect x="470" y="646" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="676.5" text-anchor="start" class="t-h">флаги органов слота Чутьё</text><text x="482.0" y="694.5" text-anchor="start" class="">раздаются только игроку</text><rect x="850" y="646" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="676.5" text-anchor="start" class="t-h">Senses и AlertState вешает психика</text><text x="862.0" y="694.5" text-anchor="start" class="">сборка тела их не меняет</text><polyline points="466.0,681.0 385.0,681.0" class="e e-pl" marker-end="url(#f1-pl)"/><text x="425.0" y="673.0" text-anchor="middle" class="t-edge">Senses.Set</text><text x="88.0" y="769.0" text-anchor="end" class="t-lab">ПСИХИКА</text><rect x="100" y="730" width="280" height="70" rx="4" class="b-pl"/><text x="112.0" y="760.5" text-anchor="start" class="t-h">психики нет</text><text x="112.0" y="778.5" text-anchor="start" class="">смена доминанты ни на что не влияет</text><rect x="470" y="730" width="290" height="70" rx="4" class="b-body"/><text x="482.0" y="760.5" text-anchor="start" class="t-h">доминанта ≥ Medium сменилась</text><text x="482.0" y="778.5" text-anchor="start" class="">→ событие onDominantChanged</text><rect x="850" y="730" width="320" height="70" rx="4" class="b-npc"/><text x="862.0" y="760.5" text-anchor="start" class="t-h">Metamorph → PsycheDispatch.Attach</text><text x="862.0" y="778.5" text-anchor="start" class="">Wolf, Snake, Moose, Hedgehog или альфа</text><polyline points="764.0,765.0 845.0,765.0" class="e e-npc" marker-end="url(#f1-npc)"/><text x="805.0" y="757.0" text-anchor="middle" class="t-edge">событие</text></svg>
